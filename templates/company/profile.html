{% extends "base.html" %}
{% block title %}Company Profile{% endblock %}

{% block content %}
<h3 class="mb-3">Company Profile</h3>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" name="company_name" value="{{ company.company_name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Industry</label>
                    <input type="text" class="form-control" name="industry" value="{{ company.industry }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">HR Contact (Mobile)</label>
                    <input type="tel" class="form-control" name="hr_contact" value="{{ company.hr_contact }}" pattern="[0-9]{10,15}" title="Enter 10 to 15 digit mobile number" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Website</label>
                    <input type="text" class="form-control" name="website" value="{{ company.website or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" name="address" value="{{ company.address or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="4" name="description">{{ company.description or '' }}</textarea>
                </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Save Profile</button>
        </form>
    </div>
</div>
{% endblock %}
