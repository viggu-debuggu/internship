{% extends "base.html" %}
{% block title %}Company Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0">Company Registration</h5></div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Company Name *</label>
                            <input type="text" class="form-control" name="company_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Industry *</label>
                            <input type="text" class="form-control" name="industry" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">HR Contact (Mobile) *</label>
                            <input type="tel" class="form-control" name="hr_contact" pattern="[0-9]{10,15}" title="Enter 10 to 15 digit mobile number" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Website</label>
                            <input type="text" class="form-control" name="website">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Company Description</label>
                            <textarea class="form-control" rows="3" name="description"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password *</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Back to Login</a>
                        <button class="btn btn-primary" type="submit">Register Company</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
