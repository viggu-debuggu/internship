{% extends "base.html" %}
{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0">Student Registration</h5></div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Roll Number *</label>
                            <input type="text" class="form-control" name="roll_number" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone *</label>
                            <input type="text" class="form-control" name="phone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password *</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Degree</label>
                            <input type="text" class="form-control" name="degree">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Branch</label>
                            <input type="text" class="form-control" name="branch">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">CGPA</label>
                            <input type="text" class="form-control" name="cgpa">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Graduation Year</label>
                            <input type="text" class="form-control" name="graduation_year">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Skills</label>
                            <textarea class="form-control" rows="3" name="skills" placeholder="Python, SQL, Flask, Data Structures"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Resume (PDF/DOC/DOCX)</label>
                            <input type="file" class="form-control" name="resume" accept=".pdf,.doc,.docx">
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-between">
                        <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Back to Login</a>
                        <button class="btn btn-primary" type="submit">Register Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
